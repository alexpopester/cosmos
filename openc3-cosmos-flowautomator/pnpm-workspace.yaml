# Settings for pnpm 10 and 11 (this plugin is a single package, not a workspace).
#
# Pin the d3 packages Vue Flow uses to their long-standing releases. New patch
# releases of all of them appeared on 2026-11-03 (published by the d3
# maintainers through GitHub Actions, with provenance); pnpm 11's
# minimumReleaseAge policy rejects packages that new, and nothing here needs
# them. Revisit after they've been out a while.
overrides:
  d3-color: 3.1.0
  d3-dispatch: 3.0.1
  d3-drag: 3.0.0
  d3-ease: 3.0.1
  d3-interpolate: 3.0.1
  d3-selection: 3.0.0
  d3-timer: 3.0.1
  d3-transition: 3.0.1
  d3-zoom: 3.0.0
  # DOMPurify, bundled through @openc3/vue-common: the version it brings has published XSS advisories
  dompurify: ^3.4.17
